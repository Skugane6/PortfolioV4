<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f2a4c" />
    <title>Searan Kuganesan, software engineer</title>
    <meta
      name="description"
      content="Software engineer (Western University, B.E.Sc. 2026). Built a component tracker supporting 2,000+ aircraft at Mitsubishi Heavy Industries and CraftTraq, a live SaaS for trade contractors."
    />
    <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/b612mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Before first paint: apply the visitor's saved motion preference so CSS
      // and the app agree from the first frame (lib/motion.ts).
      (function () {
        var d = document.documentElement;
        try {
          var m = localStorage.getItem('motion');
          if (m === 'reduce' || m === 'full') d.dataset.motion = m;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
